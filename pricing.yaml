# Token pricing, USD per 1M tokens.
#
# This file is the source of truth for cost computation (design.md §4).
# `cost_usd` is computed at INGEST using the prices in effect at that moment and
# stored on the row — never recomputed in a query. Editing this file therefore
# affects future events only, which is the point: cost history must not shift
# retroactively when a vendor changes prices.
#
# When a harness runs under a Max/Pro subscription there is no per-token billing.
# The number derived from this table is an "estimated equivalent cost", never
# "spend" (invariant 7).
#
# CHANGING A PRICE
#
# Never edit a price in place. `usage_event.price_table_version` pins each row to
# the table that produced its cost, and `agenthub replay` re-prices from that same
# version — so editing version 1 rewrites the cost of every run already recorded
# under it, silently, and the diff here looks like a one-line change.
#
# Instead:
#   1. copy the whole current table (version, updated, defaults, models) into the
#      first position of `superseded:` below, unchanged;
#   2. edit the top-level table and bump `version`.
#
# Retired tables are kept in this file rather than in per-version files so the
# addition and the edit show up in one reviewable diff. Each entry is a complete
# table, never a delta: replay must be able to reconstruct an exact price years
# later without interpreting a chain.

version: 1
updated: "2026-08-05"

defaults:
  # Cache write price is a multiplier over the input price, because it depends on
  # the TTL rather than on the model (design.md §4).
  cache_write_multiplier_5m: 1.25
  cache_write_multiplier_1h: 2.0
  cache_read_multiplier: 0.1

models:
  claude-opus-5:
    input: 5.00
    output: 25.00
  claude-sonnet-5:
    input: 3.00
    output: 15.00
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
  gpt-5.6-sol:
    input: 5.00
    output: 30.00
    cache_read_multiplier: 0.10
    cache_write_multiplier: 1.25
  gpt-5.6-terra:
    input: 2.50
    output: 15.00
    cache_read_multiplier: 0.10
    cache_write_multiplier: 1.25
  gpt-5.6-luna:
    input: 1.00
    output: 6.00
    cache_read_multiplier: 0.10
    cache_write_multiplier: 1.25

# A model absent from this table gets cost_usd = null. That is deliberate: a
# missing price must read as "unknown", never as zero. Zero is a number someone
# will trust.

# Retired tables, newest first. Empty because version 1 has never been superseded;
# a run whose pinned version is missing here makes `agenthub replay` refuse rather
# than reprice it (docs/architecture.md §4).
superseded: []
