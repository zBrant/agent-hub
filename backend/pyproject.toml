[project]
name = "agenthub"
version = "0.1.0"
description = "Local orchestrator for AI coding agents"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "python-ulid>=3.0",       # ULID ids, see docs/conventions.md §2
    "structlog>=24.4",
    "pyyaml>=6.0",            # pricing.yaml
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlmodel>=0.0.39",
    # Not a new package: greenlet is already in uv.lock as a SQLAlchemy
    # dependency, but SQLAlchemy's own marker lists `aarch64` and not `arm64`,
    # so it is skipped on Apple Silicon — the platform this project targets.
    # Without it every `await session.commit()` raises "the greenlet library is
    # required". The `asyncio` extra requires it unconditionally.
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.0",
    "pydantic-settings>=2.14.2",
    # The planner calls the Anthropic API directly (design.md §8): only the SDK
    # offers `messages.parse(output_format=<pydantic model>)`, and no harness CLI
    # has an equivalent of `output_config.format` — routing the planner through
    # one would mean prompting for JSON and parsing prose.
    "anthropic>=0.121.0",
    "psutil>=7.2.2",
    # E3 keeps parsing offline and deterministic: the base binding plus the
    # Python/web grammar wheels avoid a first-search parser download. New
    # languages require an explicit grammar and tags query.
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    # The index manager consumes filesystem changes instead of polling and
    # reparsing repositories on request paths.
    "watchfiles>=1.2.0",
]

[project.scripts]
agenthub = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
    "httpx2>=2.9.1",
    "types-psutil>=7.2.2.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "ASYNC",         # blocking calls in async code — invariant 5
    "PTH",           # pathlib over os.path — docs/conventions.md §2
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Alembic renders one CHECK constraint per line; a closed status vocabulary does
# not fit in 88 columns and reflowing generated DDL by hand invites transcription
# errors. The revision is reviewed, not rewritten.
"migrations/versions/*" = ["E501"]

# ---------------------------------------------------------------------------
# mypy — strict on the core, looser at the edges (docs/conventions.md §1)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.api.*", "app.ws.*"]
strict = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "harness: touches a real CLI; live paid turns also require AGENTHUB_RUN_LIVE_HARNESS=1",
]

# ---------------------------------------------------------------------------
# import-linter — layer contracts from docs/architecture.md §1
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers point downward only"
type = "layers"
layers = [
    "app.api | app.ws",
    "app.orchestrator",
    "app.storage",
    "app.harnesses | app.sandbox",
    "app.models",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "search/ and metrics/ are isolated verticals"
type = "forbidden"
source_modules = ["app.search", "app.metrics"]
forbidden_modules = ["app.orchestrator", "app.harnesses", "app.api", "app.ws"]

[[tool.importlinter.contracts]]
name = "Only worktree and storage touch git or run files"
type = "forbidden"
source_modules = ["app.api", "app.ws", "app.harnesses", "app.search", "app.metrics"]
forbidden_modules = ["app.orchestrator.worktree"]
allow_indirect_imports = true
