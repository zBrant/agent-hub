# Alembic configuration.
#
# There is no `sqlalchemy.url` here on purpose. The database location comes from
# app.config.Settings (default ~/.agenthub/agenthub.db, docs/architecture.md §4)
# and is injected by app.storage.db.alembic_config(), so a test can never
# migrate the real database by forgetting to override an ini file.
#
#     uv run alembic -x url=sqlite:////tmp/scratch.db upgrade head
#
# `-x url=...` overrides it for a one-off; see migrations/env.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# Revision files sort by date, which makes `ls versions/` readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
